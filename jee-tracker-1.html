<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="JEE Tracker"/>
<meta name="theme-color" content="#0f0c1a"/>
<title>JEE Tracker — Mosfique</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f0c1a;
  --bg2:#16112b;
  --surface:#1e1838;
  --surface2:#251f42;
  --border:#2e2850;
  --border2:#3d3660;
  --accent:#7c3aed;
  --accent2:#a855f7;
  --accent3:#c084fc;
  --pink:#ec4899;
  --cyan:#06b6d4;
  --green:#10b981;
  --yellow:#f59e0b;
  --red:#ef4444;
  --text:#f1f0ff;
  --text2:#a89fc0;
  --text3:#6b6380;
  --ph:#818cf8;--phb:#1e1b4b;
  --ch:#34d399;--chb:#064e3b;
  --ma:#fb923c;--mab:#431407;
  --ot:#a78bfa;--otb:#2e1065;
}
html,body{height:100%;overscroll-behavior:none;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#3d3660;border-radius:99px;}

@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes fadein{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes slideup{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:none;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes glow{0%,100%{box-shadow:0 0 20px #7c3aed44;}50%{box-shadow:0 0 40px #7c3aed88;}}

/* ── HEADER ── */
.header{
  background:linear-gradient(135deg,#0f0c1a 0%,#16112b 100%);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
  padding-top:env(safe-area-inset-top);
  backdrop-filter:blur(20px);
}
.header-inner{max-width:480px;margin:0 auto;padding:0 16px;}
.header-top{display:flex;align-items:center;justify-content:space-between;height:56px;}
.logo-wrap{display:flex;align-items:center;gap:10px;}
.logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 12px #7c3aed44;}
.logo-text{font-size:17px;font-weight:800;background:linear-gradient(90deg,var(--accent3),#e879f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.3px;}
.logo-by{font-size:9px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;line-height:1;}
.live-badge{display:flex;align-items:center;gap:5px;padding:5px 10px;background:#7c3aed18;border-radius:20px;border:1px solid #7c3aed44;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:pulse 1.2s infinite;flex-shrink:0;}
.live-text{font-size:10px;color:var(--accent3);font-weight:600;letter-spacing:.5px;}

/* ── TABS ── */
.tabs{display:flex;gap:2px;padding:8px 0;}
.tab-btn{flex:1;padding:8px 4px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;white-space:nowrap;transition:all .2s;color:var(--text3);border-radius:8px;letter-spacing:.2px;}
.tab-btn.active{color:var(--text);background:var(--surface2);box-shadow:0 2px 8px rgba(0,0,0,.3);}
.tab-dot{width:4px;height:4px;border-radius:50%;background:var(--accent2);margin:3px auto 0;opacity:0;}
.tab-btn.active .tab-dot{opacity:1;}

/* ── MAIN ── */
.main{max-width:480px;margin:0 auto;padding:16px 14px 90px;}
.tab-panel{display:none;flex-direction:column;gap:14px;}
.tab-panel.active{display:flex;animation:fadein .25s ease;}

/* ── BOTTOM NAV (mobile style) ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,12,26,.95);border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(20px);z-index:99;}
.bottom-nav-inner{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 16px;background:none;border:none;cursor:pointer;color:var(--text3);font-family:inherit;font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;transition:all .2s;border-radius:10px;}
.nav-btn.active{color:var(--accent2);}
.nav-icon{font-size:20px;line-height:1;}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;}
.card-glass{background:rgba(30,24,56,.7);border:1px solid var(--border2);border-radius:18px;padding:18px;backdrop-filter:blur(10px);}

/* ── HERO CARD ── */
.hero-card{border-radius:22px;padding:20px;background:linear-gradient(135deg,#1e1838 0%,#2d1f5e 50%,#1e1838 100%);border:1px solid var(--border2);position:relative;overflow:hidden;}
.hero-card::before{content:"";position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:radial-gradient(circle,#7c3aed22 0%,transparent 70%);}
.hero-card::after{content:"";position:absolute;bottom:-30px;left:-30px;width:120px;height:120px;background:radial-gradient(circle,#ec489922 0%,transparent 70%);}
.hero-date{font-size:13px;color:var(--text2);margin-bottom:4px;font-weight:500;}
.hero-hours{font-size:42px;font-weight:900;background:linear-gradient(90deg,var(--accent3),#e879f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;letter-spacing:-2px;}
.hero-sub{font-size:12px;color:var(--text2);margin-top:4px;}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;}
.stat-label{font-size:9px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600;}
.stat-val{font-size:24px;font-weight:800;line-height:1;letter-spacing:-1px;}
.stat-sub{font-size:10px;color:var(--text3);margin-top:3px;}

/* ── TASK CARDS ── */
.task-card{border-radius:16px;padding:14px 14px 14px 16px;margin-bottom:8px;border:1px solid var(--border);background:var(--surface);transition:all .2s;position:relative;overflow:hidden;}
.task-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
.task-card.ph::before{background:var(--ph);}
.task-card.ch::before{background:var(--ch);}
.task-card.ma::before{background:var(--ma);}
.task-card.ot::before{background:var(--ot);}
.task-card.running{border-color:var(--accent);box-shadow:0 0 0 2px #7c3aed22,0 4px 20px #7c3aed22;animation:glow 2s infinite;}
.task-card.done-card{opacity:.55;}
.task-row{display:flex;gap:10px;align-items:flex-start;}
.check-btn{width:24px;height:24px;border-radius:7px;flex-shrink:0;margin-top:1px;border:2px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s;}
.check-btn.done{border-color:var(--green);background:var(--green);}
.task-body{flex:1;min-width:0;}
.task-name{font-size:14px;font-weight:700;color:var(--text);line-height:1.3;}
.task-name.struck{text-decoration:line-through;color:var(--text3);}
.task-meta{font-size:11px;color:var(--text3);margin:3px 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.dur-chip{background:var(--surface2);padding:1px 7px;border-radius:20px;color:var(--accent3);font-size:10px;font-weight:600;}
.task-bottom{display:flex;align-items:center;gap:8px;}
.timer-num{font-size:16px;font-weight:700;letter-spacing:2px;font-family:'Courier New',monospace;color:var(--text2);}
.timer-num.live{color:var(--accent2);}
.start-btn{padding:5px 14px;border-radius:20px;border:1.5px solid var(--accent);background:transparent;color:var(--accent2);font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;letter-spacing:.3px;}
.start-btn.running{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 2px 12px #7c3aed44;}
.task-actions{display:flex;flex-direction:column;gap:2px;margin-left:4px;}
.icon-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:3px;color:var(--text3);border-radius:6px;transition:all .15s;}
.icon-btn:hover{background:var(--surface2);}
.live-pill{font-size:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;padding:2px 8px;border-radius:99px;font-weight:700;letter-spacing:.5px;}
.subj-chip{border-radius:6px;font-weight:700;display:inline-flex;align-items:center;vertical-align:middle;}
.elapsed-done{font-size:11px;color:var(--green);font-weight:600;}

/* ── ADD BTN FLOATING ── */
.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:18px;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px #7c3aed55;z-index:98;transition:all .2s;}
.fab:active{transform:scale(.93);}

/* ── BUTTONS ── */
.btn{padding:10px 22px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;border:none;transition:all .18s;letter-spacing:.2px;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px #7c3aed44;}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);}
.btn:active{transform:scale(.96);}

/* ── INPUTS ── */
.input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border2);background:var(--bg2);font-family:inherit;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;}
.input:focus{border-color:var(--accent);}
.label{font-size:10px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:600;}
.field{margin-bottom:14px;}
.subj-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.subj-pick{padding:10px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13px;border:1.5px solid var(--border2);background:var(--bg2);color:var(--text2);transition:all .15s;font-weight:600;text-align:center;}
.subj-pick.sel-ph{border-color:var(--ph);background:#1e1b4b;color:var(--ph);}
.subj-pick.sel-ch{border-color:var(--ch);background:#064e3b;color:var(--ch);}
.subj-pick.sel-ma{border-color:var(--ma);background:#431407;color:var(--ma);}
.subj-pick.sel-ot{border-color:var(--ot);background:#2e1065;color:var(--ot);}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--bg2);border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:480px;box-shadow:0 -20px 60px rgba(0,0,0,.5);border:1px solid var(--border);border-bottom:none;animation:slideup .25s ease;}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 20px;}
.modal-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:20px;letter-spacing:-.3px;}
.modal-footer{display:flex;gap:10px;margin-top:20px;}
.modal-footer .btn{flex:1;}

/* ── PROGRESS ── */
.progress-wrap{background:var(--surface2);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.progress-h8{height:8px;}
.progress-h12{height:12px;}
.progress-shimmer{background-image:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.15) 50%,transparent 100%);background-size:200% 100%;animation:shimmer 2s infinite;}

/* ── TOAST ── */
.toast-wrap{position:fixed;top:calc(70px + env(safe-area-inset-top));right:14px;z-index:9999;display:flex;flex-direction:column;gap:6px;}
.toast{padding:10px 14px;border-radius:12px;font-size:12px;cursor:pointer;max-width:240px;line-height:1.4;color:#fff;animation:fadein .2s ease;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.4);}

/* ── MISC ── */
.empty{text-align:center;padding:48px 20px;color:var(--text3);}
.empty-icon{font-size:40px;margin-bottom:10px;}
.empty-text{font-size:14px;font-weight:500;}
.group-label{font-size:9px;color:var(--text3);letter-spacing:1.8px;text-transform:uppercase;margin-bottom:8px;font-weight:700;padding-left:4px;}
.section-title{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.3px;}
.section-sub{font-size:11px;color:var(--text3);margin-top:3px;}
.pie-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.pie-legend{display:flex;flex-direction:column;gap:8px;flex:1;}
.pie-legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);}
.pie-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.history-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
.history-date{font-weight:700;color:var(--text);font-size:14px;}
.history-meta{font-size:10px;color:var(--text3);}
.history-h{font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--accent3),#e879f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.tags-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.milestone-pct{font-size:36px;font-weight:900;background:linear-gradient(90deg,var(--accent2),#e879f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-2px;line-height:1;}
.milestone-detail{font-size:12px;color:var(--text2);margin-top:2px;}
.milestone-rem{font-size:11px;color:var(--text3);text-align:right;}
.milestone-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;}
.best-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.best-val{font-size:24px;font-weight:800;letter-spacing:-1px;margin-bottom:2px;}
.best-sub{font-size:10px;color:var(--text3);}
.subj-row{margin-bottom:12px;}
.subj-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.divider{height:1px;background:var(--border);margin:4px 0 12px;}

/* ── BACKUP BANNER ── */
.backup-bar{background:var(--surface2);border:1px solid var(--border2);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.backup-text{font-size:12px;color:var(--text2);line-height:1.5;}
.backup-btns{display:flex;gap:8px;flex-shrink:0;}
.backup-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.backup-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="logo-wrap">
        <div class="logo-icon">📚</div>
        <div>
          <div class="logo-text">JEE Tracker</div>
          <div class="logo-by">by Mosfique</div>
        </div>
      </div>
      <div class="live-badge" id="liveBadge" style="display:none">
        <div class="live-dot"></div>
        <span class="live-text">LIVE</span>
      </div>
    </div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main">
  <div class="tab-panel active" id="tab-today"></div>
  <div class="tab-panel" id="tab-history"></div>
  <div class="tab-panel" id="tab-monthly"></div>
  <div class="tab-panel" id="tab-alltime"></div>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn" onclick="openModal(null)" title="Add Task">＋</button>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="nav-btn active" id="nav-today" onclick="switchTab('today',this)">
      <span class="nav-icon">⚡</span>Today
    </button>
    <button class="nav-btn" id="nav-history" onclick="switchTab('history',this)">
      <span class="nav-icon">📅</span>History
    </button>
    <button class="nav-btn" id="nav-monthly" onclick="switchTab('monthly',this)">
      <span class="nav-icon">📊</span>Monthly
    </button>
    <button class="nav-btn" id="nav-alltime" onclick="switchTab('alltime',this)">
      <span class="nav-icon">🏆</span>All Time
    </button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">New Task</div>
    <div class="field">
      <label class="label">Task Name</label>
      <input class="input" id="taskName" placeholder="e.g. Electrostatics – Gauss Law" autocomplete="off"/>
    </div>
    <div class="field">
      <label class="label">Subject</label>
      <div class="subj-btns" id="subjBtns"></div>
    </div>
    <div class="time-row">
      <div class="field"><label class="label">Start Time</label><input type="time" class="input" id="startTime"/></div>
      <div class="field"><label class="label">End Time</label><input type="time" class="input" id="endTime"/></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveTask()">Add Task</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────
const SUBJECTS=["Physics","Chemistry","Maths","Other"];
const SC={Physics:"#818cf8",Chemistry:"#34d399",Maths:"#fb923c",Other:"#a78bfa"};
const SB={Physics:"#1e1b4b",Chemistry:"#064e3b",Maths:"#431407",Other:"#2e1065"};
const SK={Physics:"ph",Chemistry:"ch",Maths:"ma",Other:"ot"};
const JEE_TARGET=2000, STORE_KEY="jee_v5", BACKUP_KEY="jee_v5_backup";

let tasks={}, activeId=null, timerInterval=null, editId=null, selSubj="Physics", curTab="today";

// ── DATA ─────────────────────────────────────────────────────────────
function todayKey(){return new Date().toISOString().slice(0,10);}
function fmtT(s){return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor((s%3600)/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

function save(){
  try{
    const data=JSON.stringify({tasks,savedAt:Date.now()});
    localStorage.setItem(STORE_KEY,data);
    // Rolling backup every 10 saves
    if(Math.random()<0.1) localStorage.setItem(BACKUP_KEY,data);
  }catch(e){}
}

function load(){
  try{
    const r=localStorage.getItem(STORE_KEY);
    if(r){const d=JSON.parse(r);tasks=d.tasks||{};}
    else{
      // Try backup
      const b=localStorage.getItem(BACKUP_KEY);
      if(b){const d=JSON.parse(b);tasks=d.tasks||{};}
    }
  }catch(e){tasks={};}
}

function exportData(){
  const data=JSON.stringify({tasks,exportedAt:new Date().toISOString()},null,2);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="jee-backup-"+todayKey()+".json";
  a.click(); URL.revokeObjectURL(a.href);
  showToast("Backup downloaded!","success");
}

function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const d=JSON.parse(ev.target.result);
      if(d.tasks){
        // Merge: keep existing + imported
        Object.keys(d.tasks).forEach(k=>{
          if(!tasks[k]) tasks[k]=[];
          d.tasks[k].forEach(t=>{
            if(!tasks[k].find(x=>x.id===t.id)) tasks[k].push(t);
          });
        });
        save(); renderTab(curTab);
        showToast("Data restored!","success");
      }
    }catch(err){showToast("Invalid backup file","warn");}
  };
  reader.readAsText(file);
}

// ── TOAST ────────────────────────────────────────────────────────────
function showToast(msg,type="info"){
  const w=document.getElementById("toastWrap");
  const d=document.createElement("div");
  d.className="toast";
  const bg=type==="success"?"#059669":type==="warn"?"#d97706":type==="err"?"#dc2626":"#6d28d9";
  d.style.background=bg;
  d.textContent=msg; d.onclick=()=>d.remove();
  w.appendChild(d); setTimeout(()=>d.remove(),3000);
}

// ── TABS ─────────────────────────────────────────────────────────────
function switchTab(name,btn){
  curTab=name;
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+name).classList.add("active");
  (btn||document.getElementById("nav-"+name)).classList.add("active");
  // Show/hide FAB
  document.getElementById("fabBtn").style.display=name==="today"?"flex":"none";
  renderTab(name);
}
function renderTab(n){
  if(n==="today") renderToday();
  else if(n==="history") renderHistory();
  else if(n==="monthly") renderMonthly();
  else if(n==="alltime") renderAllTime();
}

// ── HELPERS ──────────────────────────────────────────────────────────
function subjChip(s,small){
  const fs=small?9:11, pd=small?"2px 8px":"3px 10px";
  return `<span class="subj-chip" style="background:${SB[s]};color:${SC[s]};font-size:${fs}px;padding:${pd};border-radius:6px;font-weight:700">${s}</span>`;
}
function pbar(val,max,color,shimmer,h=8){
  const pct=Math.min(100,(val/(max||1))*100);
  const cls=shimmer?" progress-shimmer":"";
  return `<div class="progress-wrap progress-h${h}"><div class="progress-fill${cls}" style="width:${pct}%;background:${color||"var(--accent)"};${shimmer?`background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);background-size:200% 100%;`:""};"></div></div>`;
}
function statCard(label,val,sub,color){
  return `<div class="stat-card">
    <div class="stat-label">${label}</div>
    <div class="stat-val" style="color:${color||"var(--text)"}">${val}</div>
    ${sub?`<div class="stat-sub">${sub}</div>`:""}
  </div>`;
}
function durStr(s,e){
  if(!s||!e) return "";
  const sp=s.split(":"),ep=e.split(":");
  const diff=(+ep[0]*60+ +ep[1])-(+sp[0]*60+ +sp[1]);
  return diff>0?`${Math.floor(diff/60)}h ${diff%60}m`:"";
}

// ── TODAY ─────────────────────────────────────────────────────────────
function renderToday(){
  const p=document.getElementById("tab-today");
  const date=todayKey(), dt=tasks[date]||[];
  const totalSec=dt.reduce((a,t)=>a+(t.elapsed||0),0);
  const done=dt.filter(t=>t.completed).length;
  const pending=dt.filter(t=>!t.completed), comp=dt.filter(t=>t.completed);
  const now=new Date();
  const dateStr=now.toLocaleDateString("en-IN",{weekday:"long",month:"long",day:"numeric"});
  const hrs=(totalSec/3600).toFixed(1);

  let h=`<div class="hero-card">
    <div class="hero-date">${dateStr}</div>
    <div class="hero-row">
      <div>
        <div class="hero-hours">${hrs}h</div>
        <div class="hero-sub">${done} of ${dt.length} tasks done</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Daily Goal</div>
        <div style="font-size:20px;font-weight:800;color:var(--accent3)">${Math.min(100,Math.round((totalSec/3600/8)*100))}%</div>
      </div>
    </div>
    ${dt.length>0?`<div style="margin-top:14px">${pbar(totalSec,8*3600,"linear-gradient(90deg,#7c3aed,#a855f7,#ec4899)",true,8)}</div>`:""}
  </div>`;

  if(!dt.length){
    h+=`<div class="empty"><div class="empty-icon">🚀</div><div class="empty-text">No tasks yet.<br>Tap + to add your first session!</div></div>`;
    return void(p.innerHTML=h);
  }

  if(pending.length){
    h+=`<div><div class="group-label">Pending · ${pending.length}</div>`;
    pending.forEach(t=>{h+=taskCardHTML(t,activeId===t.id);});
    h+=`</div>`;
  }
  if(comp.length){
    h+=`<div><div class="group-label">Completed · ${comp.length}</div>`;
    comp.forEach(t=>{h+=taskCardHTML(t,false);});
    h+=`</div>`;
  }
  p.innerHTML=h;
}

function taskCardHTML(t,running){
  const ds=durStr(t.startTime,t.endTime);
  const metaParts=[];
  if(t.startTime) metaParts.push(t.startTime+(t.endTime?" → "+t.endTime:""));
  if(ds) metaParts.push(`<span class="dur-chip">${ds}</span>`);
  const metaRow=metaParts.length?`<div class="task-meta">${metaParts.join(" ")}</div>`:"";

  const timerRow=!t.completed
    ?`<div class="task-bottom">
        <span class="timer-num${running?" live":""}" id="tmr-${t.id}">${fmtT(t.elapsed||0)}</span>
        <button class="start-btn${running?" running":""}" onclick="doTimer('${t.id}')">${running?"⏸ Pause":"▶ Start"}</button>
        ${running?`<span class="live-pill">LIVE</span>`:""}
      </div>`
    :((t.elapsed||0)>0?`<span class="elapsed-done">✓ ${fmtT(t.elapsed)} studied</span>`:"");

  return `<div class="task-card ${SK[t.subject]||"ot"}${running?" running":""}${t.completed?" done-card":""}" id="tc-${t.id}">
    <div class="task-row">
      <button class="check-btn${t.completed?" done":""}" onclick="doDone('${t.id}')">${t.completed?"✓":""}</button>
      <div class="task-body">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px">
          <span class="task-name${t.completed?" struck":""}">${t.name}</span>
          ${subjChip(t.subject,true)}
        </div>
        ${metaRow}${timerRow}
      </div>
      <div class="task-actions">
        <button class="icon-btn" onclick="openModal('${t.id}')">✏️</button>
        <button class="icon-btn" onclick="doDelete('${t.id}')">🗑</button>
      </div>
    </div>
  </div>`;
}

// ── TIMER ─────────────────────────────────────────────────────────────
function doTimer(id){
  const date=todayKey();
  if(activeId===id){
    clearInterval(timerInterval);timerInterval=null;activeId=null;
    document.getElementById("liveBadge").style.display="none";
    renderToday();return;
  }
  if(activeId) clearInterval(timerInterval);
  activeId=id;
  document.getElementById("liveBadge").style.display="flex";
  timerInterval=setInterval(()=>{
    const dt=tasks[date]||[],idx=dt.findIndex(t=>t.id===id);
    if(idx===-1){clearInterval(timerInterval);activeId=null;return;}
    dt[idx].elapsed=(dt[idx].elapsed||0)+1;
    tasks[date]=dt; save();
    const el=document.getElementById("tmr-"+id);
    if(el) el.textContent=fmtT(dt[idx].elapsed);
  },1000);
  renderToday();
}
function doDone(id){
  const date=todayKey(),dt=tasks[date]||[],idx=dt.findIndex(t=>t.id===id);
  if(idx===-1) return;
  if(activeId===id){clearInterval(timerInterval);timerInterval=null;activeId=null;document.getElementById("liveBadge").style.display="none";}
  const was=dt[idx].completed; dt[idx].completed=!was;
  tasks[date]=dt; save(); showToast(was?"Reopened 🔄":"Completed! 🎉","success"); renderToday();
}
function doDelete(id){
  const date=todayKey(),dt=tasks[date]||[];
  if(activeId===id){clearInterval(timerInterval);timerInterval=null;activeId=null;document.getElementById("liveBadge").style.display="none";}
  tasks[date]=dt.filter(t=>t.id!==id); save(); showToast("Deleted","warn"); renderToday();
}

// ── MODAL ──────────────────────────────────────────────────────────────
function buildSubjBtns(){
  const w=document.getElementById("subjBtns"); w.innerHTML="";
  SUBJECTS.forEach(s=>{
    const b=document.createElement("button");
    b.className="subj-pick"; b.textContent=s;
    const k=SK[s];
    if(s===selSubj) b.classList.add("sel-"+k);
    b.onclick=()=>{selSubj=s;buildSubjBtns();};
    w.appendChild(b);
  });
}
function openModal(id){
  editId=id;
  if(id){
    const dt=tasks[todayKey()]||[],t=dt.find(x=>x.id===id); if(!t) return;
    document.getElementById("modalTitle").textContent="Edit Task";
    document.getElementById("saveBtn").textContent="Save Changes";
    document.getElementById("taskName").value=t.name;
    document.getElementById("startTime").value=t.startTime||"";
    document.getElementById("endTime").value=t.endTime||"";
    selSubj=t.subject||"Physics";
  } else {
    document.getElementById("modalTitle").textContent="New Task";
    document.getElementById("saveBtn").textContent="Add Task";
    document.getElementById("taskName").value="";
    document.getElementById("startTime").value="";
    document.getElementById("endTime").value="";
    selSubj="Physics";
  }
  buildSubjBtns();
  document.getElementById("modal").classList.add("open");
  setTimeout(()=>document.getElementById("taskName").focus(),150);
}
function closeModal(){document.getElementById("modal").classList.remove("open");}
function saveTask(){
  const name=document.getElementById("taskName").value.trim();
  if(!name){document.getElementById("taskName").focus();return;}
  const startTime=document.getElementById("startTime").value;
  const endTime=document.getElementById("endTime").value;
  const date=todayKey();
  if(!tasks[date]) tasks[date]=[];
  const dt=tasks[date];
  if(editId){
    const idx=dt.findIndex(t=>t.id===editId);
    if(idx!==-1) dt[idx]=Object.assign({},dt[idx],{name,subject:selSubj,startTime,endTime});
    showToast("Updated! ✨","success");
  } else {
    dt.push({id:uid(),name,subject:selSubj,startTime,endTime,elapsed:0,completed:false,addedAt:Date.now()});
    showToast("Task added! 📌","success");
  }
  tasks[date]=dt; save(); closeModal(); renderToday();
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeModal();
  if(e.key==="Enter"&&document.getElementById("modal").classList.contains("open")) saveTask();
});

// ── HISTORY ────────────────────────────────────────────────────────────
function renderHistory(){
  const p=document.getElementById("tab-history");
  const days=Object.keys(tasks).sort((a,b)=>b.localeCompare(a))
    .map(k=>({key:k,ts:tasks[k],total:tasks[k].length,done:tasks[k].filter(t=>t.completed).length,hours:tasks[k].reduce((a,t)=>a+(t.elapsed||0),0)/3600}))
    .filter(d=>d.total>0);

  const last7=Object.keys(tasks).sort((a,b)=>b.localeCompare(a)).slice(0,7).reverse();
  const barData=last7.map(k=>{
    const ts=tasks[k]||[],obj={day:k.slice(5)};
    SUBJECTS.forEach(s=>{obj[s]=ts.filter(t=>t.subject===s).reduce((a,t)=>a+(t.elapsed||0),0)/3600;});
    return obj;
  });

  let h=`<div class="section-title">Study History</div>`;

  // Backup/Restore
  h+=`<div class="backup-bar">
    <div class="backup-text">🛡️ <strong>Keep your data safe</strong><br>Export a backup or restore from file.</div>
    <div class="backup-btns">
      <button class="backup-btn primary" onclick="exportData()">Export</button>
      <button class="backup-btn" onclick="document.getElementById('importFile').click()">Restore</button>
    </div>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"/>`;

  if(barData.length>0)
    h+=`<div class="card"><div class="stat-label" style="margin-bottom:12px">Last 7 Days</div>${stackedBarSVG(barData,180)}</div>`;

  if(!days.length){h+=`<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No history yet</div></div>`;return void(p.innerHTML=h);}

  days.forEach(d=>{
    const subjs=SUBJECTS.filter(s=>d.ts.some(t=>t.subject===s));
    const ds=new Date(d.key+"T12:00:00").toLocaleDateString("en-IN",{weekday:"short",month:"short",day:"numeric"});
    h+=`<div class="card">
      <div class="history-top">
        <span class="history-date">${ds}</span>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="history-meta">${d.done}/${d.total} done</span>
          <span class="history-h">${d.hours.toFixed(1)}h</span>
        </div>
      </div>
      <div class="tags-row">${subjs.map(s=>subjChip(s,true)).join("")}</div>
    </div>`;
  });
  p.innerHTML=h;
}

// ── MONTHLY ────────────────────────────────────────────────────────────
function renderMonthly(){
  const p=document.getElementById("tab-monthly");
  const now=new Date(),yr=now.getFullYear(),mo=now.getMonth();
  const dim=new Date(yr,mo+1,0).getDate();
  const md=[];
  for(let d=1;d<=dim;d++){
    const k=yr+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const ts=tasks[k]||[];
    md.push({day:d,hours:ts.reduce((a,t)=>a+(t.elapsed||0),0)/3600,ts});
  }
  const total=md.reduce((a,d)=>a+d.hours,0);
  const sdays=md.filter(d=>d.hours>0).length, avg=sdays?total/sdays:0;
  const allTs=md.reduce((a,d)=>a.concat(d.ts),[]);
  const barData=md.filter(d=>d.hours>0).map(d=>({day:String(d.day),hours:+d.hours.toFixed(2)}));
  const pie=SUBJECTS.map(s=>({name:s,value:+(allTs.filter(t=>t.subject===s).reduce((a,t)=>a+(t.elapsed||0),0)/3600).toFixed(2)})).filter(s=>s.value>0);
  const mstr=now.toLocaleDateString("en-IN",{month:"long",year:"numeric"});

  let h=`<div class="section-title">${mstr}</div>
    <div class="stat-grid">
      ${statCard("Total Hours",total.toFixed(1)+"h","","#a855f7")}
      ${statCard("Avg / Day",avg.toFixed(1)+"h","")}
      ${statCard("Study Days",sdays,"of "+dim+" days")}
      ${statCard("Tasks",allTs.length,"")}
    </div>`;
  if(barData.length) h+=`<div class="card"><div class="stat-label" style="margin-bottom:12px">Daily Hours</div>${simpleBars(barData,170,"#7c3aed")}</div>`;
  if(pie.length) h+=`<div class="card"><div class="stat-label" style="margin-bottom:12px">Subject Split</div><div class="pie-wrap">${donutSVG(pie)}${pieLegend(pie)}</div></div>`;
  p.innerHTML=h;
}

// ── ALL TIME ───────────────────────────────────────────────────────────
function renderAllTime(){
  const p=document.getElementById("tab-alltime");
  const all=Object.values(tasks).reduce((a,arr)=>a.concat(arr),[]);
  const totalSec=all.reduce((a,t)=>a+(t.elapsed||0),0),totalH=totalSec/3600;
  const comp=all.filter(t=>t.completed).length;
  const byDay=Object.entries(tasks).map(([d,arr])=>({d,h:arr.reduce((a,t)=>a+(t.elapsed||0),0)/3600})).filter(x=>x.h>0).sort((a,b)=>b.h-a.h);
  const sdays=byDay.length,avg=sdays?totalH/sdays:0,best=byDay[0];
  const sh=SUBJECTS.map(s=>({name:s,value:all.filter(t=>t.subject===s).reduce((a,t)=>a+(t.elapsed||0),0)/3600})).sort((a,b)=>b.value-a.value);
  const most=sh[0]&&sh[0].value>0?sh[0]:null;
  const pct=Math.min(100,(totalSec/(JEE_TARGET*3600))*100);

  let h=`<div class="section-title">All-Time Stats</div>
    <div class="stat-grid">
      ${statCard("Total Hours",totalH.toFixed(1)+"h","","#a855f7")}
      ${statCard("Completed",comp,"tasks")}
      ${statCard("Study Days",sdays,"")}
      ${statCard("Avg / Day",avg.toFixed(1)+"h","")}
    </div>
    <div class="card" style="background:linear-gradient(135deg,#1e1838,#2d1f5e);border-color:var(--border2)">
      <div class="stat-label" style="margin-bottom:12px">🎯 JEE 2000h Milestone</div>
      <div class="milestone-row">
        <div><div class="milestone-pct">${pct.toFixed(2)}%</div><div class="milestone-detail">${totalH.toFixed(1)}h of 2000h</div></div>
        <div class="milestone-rem">${Math.max(0,JEE_TARGET-Math.floor(totalH))}h to go</div>
      </div>
      ${pbar(totalSec,JEE_TARGET*3600,"linear-gradient(90deg,#7c3aed,#a855f7,#ec4899)",true,12)}
    </div>
    <div class="best-grid">
      ${best?`<div class="card">
        <div class="stat-label" style="margin-bottom:6px">🏆 Best Day</div>
        <div class="best-val" style="color:#f59e0b">${best.h.toFixed(1)}h</div>
        <div class="best-sub">${new Date(best.d+"T12:00:00").toLocaleDateString("en-IN",{weekday:"short",month:"short",day:"numeric"})}</div>
      </div>`:""}
      ${most?`<div class="card">
        <div class="stat-label" style="margin-bottom:6px">📚 Top Subject</div>
        <div class="best-val" style="color:${SC[most.name]}">${most.name}</div>
        <div class="best-sub">${most.value.toFixed(1)}h total</div>
      </div>`:""}
    </div>
    <div class="card">
      <div class="stat-label" style="margin-bottom:14px">Subject Totals</div>
      ${sh.map(s=>`<div class="subj-row">
        <div class="subj-row-top">${subjChip(s.name,true)}<span style="font-size:12px;color:${SC[s.name]};font-weight:700">${s.value.toFixed(1)}h</span></div>
        ${pbar(s.value,sh[0]?sh[0].value||1:1,SC[s.name],false,8)}
      </div>`).join("")}
    </div>`;
  p.innerHTML=h;
}

// ── SVG CHARTS ──────────────────────────────────────────────────────────
function simpleBars(data,h,color){
  if(!data.length) return "";
  const W=600,H=h,PL=32,PR=8,PT=8,PB=22,cw=W-PL-PR,ch=H-PT-PB;
  const maxV=Math.max(...data.map(d=>d.hours),.1);
  const gap=cw/data.length, bw=Math.max(6,gap*.65);
  let svg="",grid="";
  for(let i=0;i<=4;i++){
    const v=(maxV/4)*i,y=PT+ch-(v/maxV)*ch;
    grid+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#2e2850" stroke-width="1"/>`;
    grid+=`<text x="${(PL-4).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#6b6380">${v.toFixed(1)}</text>`;
  }
  data.forEach((d,i)=>{
    const x=PL+i*gap+(gap-bw)/2,bh=(d.hours/maxV)*ch,y=PT+ch-bh;
    svg+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="4" fill="${color}" opacity=".9"/>`;
    if(data.length<=15||i%Math.ceil(data.length/8)===0)
      svg+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="8" fill="#6b6380">${d.day}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">${grid}${svg}</svg>`;
}

function stackedBarSVG(data,h){
  if(!data.length) return "";
  const W=600,H=h,PL=32,PR=8,PT=8,PB=22,cw=W-PL-PR,ch=H-PT-PB;
  const totals=data.map(d=>SUBJECTS.reduce((a,s)=>a+(d[s]||0),0));
  const maxV=Math.max(...totals,.1);
  const gap=cw/data.length, bw=Math.max(16,gap*.65);
  let svg="",grid="";
  for(let i=0;i<=4;i++){
    const v=(maxV/4)*i,y=PT+ch-(v/maxV)*ch;
    grid+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#2e2850" stroke-width="1"/>`;
    grid+=`<text x="${(PL-4).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#6b6380">${v.toFixed(1)}</text>`;
  }
  data.forEach((d,i)=>{
    const x=PL+i*gap+(gap-bw)/2; let yOff=PT+ch;
    SUBJECTS.forEach(s=>{
      const v=d[s]||0; if(!v) return;
      const bh=(v/maxV)*ch; yOff-=bh;
      svg+=`<rect x="${x.toFixed(1)}" y="${yOff.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" fill="${SC[s]}" opacity=".9"/>`;
    });
    svg+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="8" fill="#6b6380">${d.day}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">${grid}${svg}</svg>`;
}

function donutSVG(pie){
  const R=70,r=45,cx=80,cy=80,sz=160;
  const total=pie.reduce((a,s)=>a+s.value,0); if(!total) return "";
  let angle=-Math.PI/2,paths="";
  pie.forEach(s=>{
    const a=(s.value/total)*2*Math.PI;
    const x1=cx+R*Math.cos(angle),y1=cy+R*Math.sin(angle);
    const x2=cx+R*Math.cos(angle+a),y2=cy+R*Math.sin(angle+a);
    const xi=cx+r*Math.cos(angle+a),yi=cy+r*Math.sin(angle+a);
    const xj=cx+r*Math.cos(angle),yj=cy+r*Math.sin(angle);
    const lg=a>Math.PI?1:0;
    paths+=`<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${lg},1 ${x2.toFixed(2)},${y2.toFixed(2)} L${xi.toFixed(2)},${yi.toFixed(2)} A${r},${r} 0 ${lg},0 ${xj.toFixed(2)},${yj.toFixed(2)} Z" fill="${SC[s.name]}" opacity=".9"/>`;
    angle+=a;
  });
  return `<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}" style="flex-shrink:0">${paths}</svg>`;
}
function pieLegend(pie){
  const total=pie.reduce((a,s)=>a+s.value,0);
  return `<div class="pie-legend">${pie.map(s=>`<div class="pie-legend-item"><div class="pie-dot" style="background:${SC[s.name]}"></div><span>${s.name} — ${Math.round((s.value/total)*100)}% (${s.value.toFixed(1)}h)</span></div>`).join("")}</div>`;
}

load();

// Auto-save every 30s as extra safety
setInterval(save, 30000);
